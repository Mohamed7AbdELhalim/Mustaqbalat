# يعرّف الاسم الرسمي لسير العمل في GitHub Actions لنشر منصة مستقبلات السحابية ومحوّل إضافة الويب تلقائياً دون استهلاك مساحة على جهاز المستخدم.
name: Deploy Zero-Space Web Studio to GitHub Pages

# يفتح قسم محفزات التشغيل التلقائي واليدوي المرتبطة بسير العمل المعرّف في السطر السابق.
on:
  # يحدد حدث الدفع البرمجي (push) لتشغيل النشر تلقائياً عند تحديث الشفرة المصدرية.
  push:
    # يحصر محفز الدفع السابق في الفرع الرئيسي main لضمان نشر النسخة المستقرة المعتمدة من المشروع.
    branches: ["main"]
  # يتيح تشغيل سير العمل يدوياً من تبويب Actions في GitHub في أي وقت بجانب الدفع التلقائي أعلاه.
  workflow_dispatch:

# يفتح قسم صلاحيات الرمز الأمني (GITHUB_TOKEN) اللازمة لتنفيذ عملية النشر على خدمة GitHub Pages.
permissions:
  # يمنح صلاحية القراءة فقط لمحتويات المستودع لسحب ملفات index.html وextension/ وconverter/ بأمان.
  contents: read
  # يمنح صلاحية الكتابة على خدمة GitHub Pages استكمالاً لصلاحية قراءة الملفات في السطر السابق.
  pages: write
  # يمنح صلاحية إصدار رمز الهوية الموثق (OIDC) المطلوب للتحقق الأمني من عملية النشر في GitHub Pages.
  id-token: write

# يفتح إعدادات التحكم في التزامن لمنع تضارب عمليات النشر المتتالية للمنصة.
concurrency:
  # يجمع عمليات النشر تحت مجموعة واحدة باسم "pages" لتنظيم طابور النشر بالتتابع.
  group: "pages"
  # يمنع إلغاء عملية نشر جارية حالياً لضمان اكتمال رفع ملفات الأداة دون انقطاع.
  cancel-in-progress: false

# يبدأ تعريف المهام التنفيذية الفردية التي ستنفذ ضمن الصلاحيات وقواعد التزامن المحددة أعلاه.
jobs:
  # يعرّف مهمة النشر الرئيسية تحت المعرّف البرمجي deploy.
  deploy:
    # يربط مهمة deploy ببيئة النشر الرسمية في إعدادات مستودع GitHub.
    environment:
      # يسمي البيئة github-pages لتتوافق مع معايير حماية بيئات النشر في المنصة.
      name: github-pages
      # يربط رابط البيئة بالرابط الفعلي الناتج عن خطوة deployment لاحقاً لعرضه في واجهة GitHub.
      url: ${{ steps.deployment.outputs.page_url }}
    # يحدد نظام التشغيل الافتراضي (أحدث نسخة Ubuntu) الذي ستعمل عليه خطوات هذه المهمة.
    runs-on: ubuntu-latest
    # يبدأ تسلسل الخطوات التنفيذية المرتبة زمنياً داخل بيئة Ubuntu المحددة في السطر السابق.
    steps:
      # يعطي عنواناً واضحاً للخطوة الأولى الخاصة بجلب ملفات المستودع.
      - name: Checkout
        # يستدعي أداة actions/checkout الرسمية لنسخ كافة ملفات مشروع مستقبلات إلى بيئة البناء.
        uses: actions/checkout@v4
      # يعرّف الخطوة الثانية لتهيئة إعدادات GitHub Pages بعد اكتمال جلب الملفات في الخطوة السابقة.
      - name: Setup Pages
        # يشغّل أداة configure-pages لضبط المسارات والروابط النسبية الخاصة باستضافة المنصة.
        uses: actions/configure-pages@v5
      # يعرّف الخطوة الثالثة لحزم ملفات المنصة الساكنة تمهيداً لرفعها بعد التهيئة السابقة.
      - name: Upload artifact
        # يستدعي أداة upload-pages-artifact لتجهيز أرشيف النشر المتوافق مع GitHub Pages.
        uses: actions/upload-pages-artifact@v3
        # يفتح معاملات التخصيص الخاصة بأداة رفع الأرشيف في السطر السابق.
        with:
          # يحدد المسار "." (جذر المستودع بالكامل شاملاً index.html وextension/ وconverter/) ليُرفَع دون الحاجة لأي خطوة بناء خارجية.
          path: "."
      # يعرّف الخطوة الختامية لنشر الأرشيف المرفوع في الخطوة السابقة وإتاحته على الويب العام.
      - name: Deploy to GitHub Pages
        # يمنح الخطوة المعرّف deployment ليرتبط بمخرج page_url المُشار إليه في قسم environment أعلى الملف.
        id: deployment
        # ينفذ عملية النشر النهائية عبر deploy-pages ليصبح المشروع متاحاً للاستخدام الفوري بدون تنزيل.
        uses: actions/deploy-pages@v4
